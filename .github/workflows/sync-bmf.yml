name: Daily BMF sync

# Imports the BMF list of sham companies once a day (REQ-FUNC-070) straight into the production database,
# like `create_superadmin` in README.md: Render's free plan has no shell or scheduler, and this way the
# sleeping web service doesn't need to wake up. A failed import turns the run red and keeps the last good
# copy (REQ-FUNC-073); every run, red or green, writes one sync log row (REQ-FUNC-072).
# Setup: the repository secret DATABASE_URL (see "Daily BMF sync" in README.md).

on:
  schedule:
    # Daily at 03:17 UTC. GitHub may start scheduled runs late; the stale flag only appears after 48 h.
    - cron: "17 3 * * *"
  # Manual start: Actions → Daily BMF sync → Run workflow.
  workflow_dispatch:

